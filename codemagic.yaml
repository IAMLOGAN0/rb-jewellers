workflows:
  ios-workflow:
    name: iOS Build
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Set iOS deployment target to 13.0
        script: |
          plutil -replace MinimumOSVersion -string "13.0" ios/Runner/Info.plist
          sed -i '' 's/PLATFORM_VERSION = .*/PLATFORM_VERSION = 13.0;/' ios/Podfile || true
    scripts:
      - flutter pub get
      - flutter build ios --release
    artifacts:
      - build/ios/ipa
